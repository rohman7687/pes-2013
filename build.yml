name: Build PES 2013 Ultimate APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode Proyek
        uses: actions/checkout@v4

      - name: 2. Siapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Generate Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 5. Compile Menjadi APK
        run: gradle assembleDebug

      - name: 6. Unggah Hasil APK Siap Unduh
        uses: actions/upload-artifact@v4
        with:
          name: PES2013-Ultimate-Patcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
